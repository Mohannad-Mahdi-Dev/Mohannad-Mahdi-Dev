<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Mohannad's Engineering Loop</title>
  <desc id="desc">A seven-step learning and engineering process: Learn, Understand, Build, Solve, Debug, Improve, Repeat.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#56D364" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#56D364"/>
      <stop offset="1" stop-color="#56D364" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#56D364"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#30363D"/>
  <text x="60" y="58" fill="#E6EDF3" font-size="24" font-weight="700" font-family="sans-serif">mohannad / engineering-loop</text>
  <text x="60" y="88" fill="#8B949E" font-size="15" font-family="sans-serif">A practical way of learning software engineering</text>
  <path d="M120 205 H1080" stroke="url(#line)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)"/>
  <path d="M1080 205 C1140 205 1140 285 1080 285 H120 C60 285 60 125 120 125" fill="none" stroke="#56D364" stroke-width="2" stroke-dasharray="7 9" opacity="0.35" marker-end="url(#arrow)"/>

  <g font-family="sans-serif">
    <g transform="translate(50 145)">
      <rect width="145" height="98" rx="14" fill="#161B22" stroke="#30363D"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">01</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Learn</text><text x="18" y="82" fill="#8B949E" font-size="12">start curious</text>
    </g>
    <g transform="translate(215 145)">
      <rect width="145" height="98" rx="14" fill="#161B22" stroke="#30363D"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">02</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Understand</text><text x="18" y="82" fill="#8B949E" font-size="12">make it clear</text>
    </g>
    <g transform="translate(380 145)">
      <rect width="145" height="98" rx="14" fill="#161B22" stroke="#30363D"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">03</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Build</text><text x="18" y="82" fill="#8B949E" font-size="12">make it real</text>
    </g>
    <g transform="translate(545 145)">
      <rect width="145" height="98" rx="14" fill="#161B22" stroke="#30363D"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">04</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Solve</text><text x="18" y="82" fill="#8B949E" font-size="12">break it down</text>
    </g>
    <g transform="translate(710 145)">
      <rect width="145" height="98" rx="14" fill="#161B22" stroke="#30363D"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">05</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Debug</text><text x="18" y="82" fill="#8B949E" font-size="12">learn from failure</text>
    </g>
    <g transform="translate(875 145)">
      <rect width="145" height="98" rx="14" fill="#161B22" stroke="#30363D"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">06</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Improve</text><text x="18" y="82" fill="#8B949E" font-size="12">raise the quality</text>
    </g>
    <g transform="translate(1040 145)">
      <rect width="110" height="98" rx="14" fill="#161B22" stroke="#56D364"/>
      <circle cx="24" cy="24" r="12" fill="#56D364"/><text x="24" y="29" text-anchor="middle" fill="#0D1117" font-size="12" font-weight="700">07</text>
      <text x="18" y="62" fill="#E6EDF3" font-size="18" font-weight="700">Repeat</text><text x="18" y="82" fill="#8B949E" font-size="12">keep growing</text>
    </g>
  </g>
</svg>
